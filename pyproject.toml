[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bannerize"
version = "0.1.0"
description = "Pull your Destiny 2 guardians from Bungie's API and export Blender-ready Cycles scenes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bannerize contributors" }]
dependencies = [
    "requests>=2.31",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bannerize = "bannerize.cli:main"

[tool.setuptools.packages.find]
include = ["bannerize*"]
